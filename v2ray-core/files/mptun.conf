
config mptun 'global'
	option enable '0'
	option enable_mpifd '1'
	option mptun 'mptun0'
	option tcpmark '0x1'
	option udpmark '0x2'
	option mode '0'
	option node 'default'

config mptun 'config'
    list profile '/etc/mptun/vmessclient.cfg'
    list profile '/etc/mptun/select.cfg'

config interface 'wan'
	option metric '1'

config interface 'secondwan'
	option metric '2'

config interface 'wwan'
	option metric '3'

config interface 'tethering'
	option metric '4'

config interface 'modem_0000_4'
	option device 'rmnet_mhi0'
	option metric '5'
	list mptcp_flags 'subflow'
