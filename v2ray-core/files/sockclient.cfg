{
    "log": {
        "loglevel": "debug"
    },
    "inbounds": [
    {
      "tag":"transparent",
      "port": 1080,
      "protocol": "dokodemo-door",
      "settings": {
        "network": "tcp,udp",
        "followRedirect": true
      },
      "sniffing": {
        "enabled": true,
        "destOverride": [
          "http",
          "tls"
        ]
      },
      "streamSettings": {
        "sockopt": {
          "tproxy": "tproxy", // 透明代理使用 TPROXY 方式
          "mark":255
        }
      }
    }
    ],
    "outbounds": [
        {
            "protocol": "socks",
            "settings": {
                "servers": [
                    {
                        "address": "47.106.201.8",
                        "port": 22345
                    }
                ]
            },
            "streamSettings": {
                "sockopt": {
          		    "mptcp": true
        	    },
                "network": "tcp",
                "security": "tls",
                "tlsSettings": {
                    "allowInsecure":true
                }
            },
            "tag": "proxy"
        }
    ]
}